<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="SAMBS.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#2563eb" />
    <meta
      name="description"
      content="SAMB's Laundry - Professional laundry and dry cleaning services at your fingertips. Book, track, and manage your orders with ease."
    />

    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SAMB's Laundry" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="SAMBS.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="SAMBS.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="SAMBS.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="SAMBS.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Microsoft PWA -->
    <meta name="msapplication-TileColor" content="#2563eb" />
    <meta
      name="msapplication-config"
      content="%PUBLIC_URL%/browserconfig.xml"
    />

    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="SAMB's Laundry - Mobile App" />
    <meta
      property="og:description"
      content="Professional laundry and dry cleaning services at your fingertips"
    />
    <meta property="og:image" href="SAMBS.png" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SAMB's Laundry - Mobile App" />
    <meta
      name="twitter:description"
      content="Professional laundry and dry cleaning services at your fingertips"
    />
    <meta name="twitter:image" content="SAMBS.png" />

    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>SAMB's Laundry - Mobile App</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
